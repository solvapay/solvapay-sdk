[workspace]
resolver = "2"
members = [
  "core/solvapay-core",
  "core/solvapay-mcp",
  "core/solvapay-dto",
  "core/solvapay-export",
  "core/solvapay-transport",
  "sdks/rust",
  "sdks/rust-mcp",
  "sdks/node-native",
  "sdks/wasm",
  "sdks/python",
  "sdks/ruby/ext/solvapay",
  "sdks/go/wasm",
  "sdks/capi",
  "tools/codegen/dto-gen",
  "tools/conformance/fixture-runner",
  "tools/conformance/shadow-invoker",
  "tools/conformance/live-contract",
  "tools/shared/repo-paths",
]
exclude = [
  "examples/rust/guerrillamail-mcp",
  "internal/fuzz",
]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.96"
repository = "https://github.com/solvapay/solvapay-sdk"
homepage = "https://solvapay.com"
keywords = ["solvapay", "payments", "sdk", "billing"]
categories = ["api-bindings", "finance"]

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150", features = ["preserve_order"] }
serde_norway = "0.9.42"
hmac = "0.13.0"
sha2 = "0.11.0"
subtle = "2.6.1"
# Asymmetric JWT verify (MCP bearer / JWKS). Server/edge only — never the browser graph.
rsa = { version = "0.9.8", default-features = false, features = ["std"] }
p256 = { version = "0.13.2", default-features = false, features = ["ecdsa", "arithmetic"] }
thiserror = "2.0.18"
walkdir = "2.5.0"
# dto-gen Phase 2: parse solvapay-core items (already in the lockfile via wasm-bindgen).
syn = { version = "2.0.119", features = ["full"] }
# Native HTTP (step 19): rustls only — no OpenSSL / default-tls.
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls"] }
# Dev-only: mock-server round-trips + async test runtime (not in production graphs).
tokio = { version = "1.52.4", features = ["rt", "macros"] }
wiremock = "0.6.5"
# WASM Fetch transport (step 20): versions must match wasm-bindgen-cli exactly.
wasm-bindgen = "0.2.126"
js-sys = "0.3.103"
wasm-bindgen-futures = "0.4.76"
web-sys = "0.3.103"
wasm-bindgen-test = "0.3.76"
# Layer 1 MCP protocol for the hand-written MA-Rs adapter (never reimplemented in core).
rmcp = { version = "3.2.0", default-features = false, features = ["server"] }

[workspace.lints.rust]
missing_docs = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
missing_docs_in_private_items = "deny"

# §7.2 WASM size profile — used by later wasm-bindgen / WASI builds.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
panic = "abort"
codegen-units = 1
