name: Contract boundary

# The contract (conformance cases, their lock, openapi/) belongs to the TypeScript SDK,
# the reference. A PR that changes it and a language folder together fails, so a
# language can't edit the cases it is judged by. Label a PR `contract-change` to allow
# it on purpose (the PR that introduces a language does).
#
# Its own workflow so it also runs when labels change: a re-run replays the original
# event, which carries the labels the PR had then.
on:
  pull_request:
    branches: [main, dev]
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  contract-boundary:
    name: Contract boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: A PR changes the contract or a language, not both
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: node scripts/check-contract-boundary.mjs
