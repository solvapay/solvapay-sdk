name: Publish Stable Releases

# Changesets-driven stable publish.
#
# On every push to `main`, `changesets/action` opens (or updates) a
# "Version Packages" PR whose body enumerates every accumulated
# `.changeset/*.md` grouped by semver bump. Merging that PR applies
# the version bumps + regenerates CHANGELOG.md for every affected
# package, which then triggers this workflow again — this time with
# an empty `.changeset/` directory and bumped versions, so
# `changesets/action` takes the `publish` branch and ships to the
# `@latest` dist-tag with matching git tags.
#
# The "open Version Packages PR" leg uses a token minted from the
# `solvapay-release-bot` GitHub App rather than the default
# `GITHUB_TOKEN`. The org has `can_approve_pull_request_reviews: false`
# at the org level (and the corresponding repo-level toggle is grayed
# out), which blocks `GITHUB_TOKEN` from creating PRs. App tokens are
# governed by the App's own installation permissions and bypass that
# restriction cleanly. Required repo secrets: `RELEASE_APP_ID`,
# `RELEASE_APP_KEY` (full `.pem`), `NPM_TOKEN`.
# Manual `workflow_dispatch` defaults to dry-run: full pre-publish gates, then
# `changeset status` + `pnpm -r publish --dry-run` (no NPM_TOKEN, skips
# changesets/action). Set `dry_run=false` to take the real publish/PR path.
# Push-to-main is always the real path. `workflow_dispatch` inputs resolve
# against the default branch — a dry-run dispatch of this new input is a
# post-merge action item until this lands on `main`.
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Skip changesets/action; run gates + pnpm -r publish --dry-run (no NPM_TOKEN)'
        required: false
        type: boolean
        default: true

concurrency:
  group: publish-stable
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # The default `GITHUB_TOKEN` is held to read-only here. All
    # write-side GitHub API calls (commit, branch push, "Version
    # Packages" PR open/update) flow through the `solvapay-release-bot`
    # GitHub App token minted in the first step below — that token
    # bypasses the org policy that blocks `GITHUB_TOKEN` from creating
    # PRs (`can_approve_pull_request_reviews: false`). `id-token: write`
    # stays for npm provenance on the publish leg.
    permissions:
      contents: read
      id-token: write

    steps:
      # Mints a short-lived (60-minute) installation token for the
      # `solvapay-release-bot` GitHub App. PRs opened with this token are
      # authored as `solvapay-release-bot[bot]` and are not subject to
      # the org's "GitHub Actions cannot create or approve pull requests"
      # restriction, which only governs the default `GITHUB_TOKEN`.
      # Dry-run dispatches skip this so they need no RELEASE_APP_* secrets.
      - name: Generate release-bot token
        id: app-token
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Deno
        run: |
          DENO_VERSION=2.7.4
          curl -fsSL "https://github.com/denoland/deno/releases/download/v${DENO_VERSION}/deno-x86_64-unknown-linux-gnu.zip" -o /tmp/deno.zip
          unzip -o /tmp/deno.zip -d /tmp/deno
          sudo install -m 755 /tmp/deno/deno /usr/local/bin/deno
          deno --version

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Catches the "stale preview baseline" failure mode we hit in April
      # 2026, where `core`/`auth`/`solvapay` sat at `1.0.8-preview.10` on
      # main and `pnpm publish` baked that string into every workspace dep
      # reference of the freshly-published siblings. Also requires every
      # workspace:* production dep of a publishable package to already exist
      # on the npm registry (or a declared UNPUBLISHED_DEP_ALLOWLIST entry).
      - name: Release dry-run gate
        run: pnpm exec tsx tools/repo/check-release-dryrun.ts --registry

      - name: Check dependency health
        run: pnpm deps:check

      - name: Build packages
        run: pnpm build:packages

      - name: Run tests
        run: pnpm test

      - name: Validate fetch-runtime — Node gate
        run: pnpm validate:fetch-runtime

      # Deno gate — type-checks examples/typescript/supabase-edge-mcp against the
      # workspace source of the packages this run publishes. There is
      # deliberately no dist-tag-pinned counterpart here: this workflow
      # ships `@latest`, so gating on `@preview` would validate an
      # artifact the run did not produce, and gating on `@latest` would
      # validate the *previous* release.
      - name: Validate fetch-runtime — Deno gate (workspace source)
        run: pnpm --filter @example/supabase-edge-mcp validate:workspace

      - name: Dry-run npm publish
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          pnpm changeset status
          pnpm -r publish --dry-run --no-git-checks

      - name: Create Release PR or publish
        id: changesets
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        uses: changesets/action@v1
        with:
          # `pnpm changeset:version` is the monorepo's wrapper around
          # `changeset version`; same behaviour, respects our config.
          version: pnpm changeset:version
          publish: pnpm changeset:publish
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          # Use the App-installation token so `changesets/action` can
          # create + update the "Version Packages" PR. `NPM_TOKEN` still
          # authenticates the publish step against the npm registry.
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Post-publish verification — mirrors the guard in
      # publish-preview.yml. Only runs when `changesets/action` actually
      # published (i.e. merging the "Version Packages" PR), otherwise
      # there's nothing to verify. The action exposes `published` and
      # `publishedPackages` outputs we consume directly instead of
      # re-parsing the publish log.
      - name: Verify published packages landed on npm
        if: steps.changesets.outputs.published == 'true'
        run: node tools/repo/verify-npm-publishes.mjs --packages='${{ steps.changesets.outputs.publishedPackages }}'
