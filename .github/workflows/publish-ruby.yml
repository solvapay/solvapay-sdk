name: Publish Ruby (RubyGems)

# Separate from the npm Changesets workflow (`.github/workflows/publish.yml`).
# Builds platform gems via rb-sys-dock on Linux (gnu) and native-host
# `rake native gem` on Darwin, runs `check-gems.rb`, then publishes with
# RubyGems Trusted Publishing (OIDC).
#
# Default path is dry-run: build + check-gems + local `gem install` (RubyGems
# has no TestPyPI equivalent). Real `gem push` is gated behind
# `workflow_dispatch` input `publish_to_rubygems=true` (or a `solvapay-ruby-v*`
# tag once maintainers enable that path).
#
# Version stamping (§7.7):
#   SOLVAPAY_RELEASE_VERSION → gem / native `version`
#   SOLVAPAY_CORE_SHA        → `native_build_info` coreSha
#
# Linux platform gems use rb-sys-dock (`--mount-toolchains`, Magnus 0.8).
# Darwin stays on native hosts. musl gems are not published: dock hosts do
# not register `native:*-linux-musl` rake tasks.
# Windows (x64-mingw-ucrt) prebuilt gems are not published: the dock mingw
# image still fails rb-sys/bindgen inside LLVM AVX10.2/AMX headers (same as
# Temporal). Windows consumers install the source gem and compile locally.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release-train version for the gem (e.g. 0.1.0)'
        required: true
        type: string
        default: '0.1.0'
      publish_to_rubygems:
        description: 'Publish to RubyGems.org (default: dry-run only)'
        required: false
        type: boolean
        default: false
  push:
    tags:
      - 'solvapay-ruby-v*'
      - 'rehearsal/solvapay-ruby-v*'

permissions:
  contents: read

jobs:
  build-gems:
    name: build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: sdks/ruby
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x86_64-linux
            os: ubuntu-latest
            dock: true
          - platform: aarch64-linux
            os: ubuntu-latest
            dock: true
          - platform: x86_64-darwin
            os: macos-15-intel
            dock: true
          - platform: arm64-darwin
            os: macos-latest
            dock: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Ruby + Rust
        uses: oxidize-rb/actions/setup-ruby-and-rust@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          cargo-cache: true
          working-directory: sdks/ruby

      - name: Resolve version + core SHA
        id: meta
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          elif [[ "${GITHUB_REF_NAME}" == rehearsal/* ]]; then
            BASE="${GITHUB_REF_NAME#rehearsal/solvapay-ruby-v}"
            VERSION="${BASE}.pre.${GITHUB_RUN_NUMBER}"
          else
            VERSION="${GITHUB_REF_NAME#solvapay-ruby-v}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "core_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Stamp version.rb
        shell: bash
        run: |
          ruby -e '
            path = "lib/solvapay/version.rb"
            version = ENV.fetch("VERSION")
            text = File.read(path)
            text = text.sub(/VERSION = ".*"/, "VERSION = \"#{version}\"")
            File.write(path, text)
          '
        env:
          VERSION: ${{ steps.meta.outputs.version }}

      - name: Bundle install
        run: bundle install

      - name: Native platform gem
        if: ${{ !matrix.dock }}
        run: bundle exec rake native gem
        env:
          SOLVAPAY_RELEASE_VERSION: ${{ steps.meta.outputs.version }}
          SOLVAPAY_CORE_SHA: ${{ steps.meta.outputs.core_sha }}

      - name: Dock cross-compile platform gem
        if: ${{ matrix.dock }}
        run: ./scripts/dock-build.sh ${{ matrix.platform }} 3.1:3.2:3.3:3.4
        env:
          SOLVAPAY_RELEASE_VERSION: ${{ steps.meta.outputs.version }}
          SOLVAPAY_CORE_SHA: ${{ steps.meta.outputs.core_sha }}

      - name: Upload gem artifact
        uses: actions/upload-artifact@v4
        with:
          name: publish-ruby-gem-${{ matrix.platform }}
          path: sdks/ruby/pkg/*.gem
          if-no-files-found: error

  build-source-gem:
    name: build source gem
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/ruby
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Ruby + Rust
        uses: oxidize-rb/actions/setup-ruby-and-rust@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          cargo-cache: true
          working-directory: sdks/ruby

      - name: Resolve version + core SHA
        id: meta
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          elif [[ "${GITHUB_REF_NAME}" == rehearsal/* ]]; then
            BASE="${GITHUB_REF_NAME#rehearsal/solvapay-ruby-v}"
            VERSION="${BASE}.pre.${GITHUB_RUN_NUMBER}"
          else
            VERSION="${GITHUB_REF_NAME#solvapay-ruby-v}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "core_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Stamp version.rb
        shell: bash
        run: |
          ruby -e '
            path = "lib/solvapay/version.rb"
            version = ENV.fetch("VERSION")
            text = File.read(path)
            text = text.sub(/VERSION = ".*"/, "VERSION = \"#{version}\"")
            File.write(path, text)
          '
        env:
          VERSION: ${{ steps.meta.outputs.version }}

      - name: Bundle install
        run: bundle install

      - name: Build source gem
        run: bundle exec rake build
        env:
          SOLVAPAY_RELEASE_VERSION: ${{ steps.meta.outputs.version }}
          SOLVAPAY_CORE_SHA: ${{ steps.meta.outputs.core_sha }}

      - name: Upload source gem artifact
        uses: actions/upload-artifact@v4
        with:
          name: publish-ruby-source-gem
          path: sdks/ruby/pkg/*.gem
          if-no-files-found: error

  build-mcp-gem:
    name: build mcp gem
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/ruby-mcp
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: sdks/ruby-mcp

      - name: Resolve version
        id: meta
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          elif [[ "${GITHUB_REF_NAME}" == rehearsal/* ]]; then
            BASE="${GITHUB_REF_NAME#rehearsal/solvapay-ruby-v}"
            VERSION="${BASE}.pre.${GITHUB_RUN_NUMBER}"
          else
            VERSION="${GITHUB_REF_NAME#solvapay-ruby-v}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Stamp version.rb
        shell: bash
        run: |
          ruby -e '
            path = "lib/solvapay/mcp/version.rb"
            version = ENV.fetch("VERSION")
            text = File.read(path)
            text = text.sub(/VERSION = ".*"/, "VERSION = \"#{version}\"")
            File.write(path, text)
          '
        env:
          VERSION: ${{ steps.meta.outputs.version }}

      - name: Build gem
        run: |
          mkdir -p pkg
          gem build solvapay-mcp.gemspec --output pkg/solvapay-mcp.gem

      - name: Upload mcp gem artifact
        uses: actions/upload-artifact@v4
        with:
          name: publish-ruby-mcp-gem
          path: sdks/ruby-mcp/pkg/*.gem
          if-no-files-found: error

  publish:
    name: publish
    runs-on: ubuntu-latest
    needs:
      - build-gems
      - build-source-gem
      - build-mcp-gem
    defaults:
      run:
        working-directory: sdks/ruby
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: sdks/ruby/gems
          pattern: publish-ruby-*
          merge-multiple: true

      - name: check-gems.rb
        run: ruby scripts/check-gems.rb --dir gems

      - name: Dry-run local gem install
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_to_rubygems != true }}
        shell: bash
        run: |
          gem_file="$(find gems -name '*.gem' | head -n1)"
          test -n "${gem_file}"
          gem install --local "${gem_file}"
          ruby -e 'require "solvapay"; puts SolvaPay.version'

      - name: Configure RubyGems Credentials
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish_to_rubygems == true) || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/solvapay-ruby-v')) }}
        uses: rubygems/configure-rubygems-credentials@v1

      - name: Publish to RubyGems
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish_to_rubygems == true) || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/solvapay-ruby-v')) }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          gem_already_published() {
            local name version
            name="$(ruby -e 'require "rubygems/package"; puts Gem::Package.new(ARGV[0]).spec.name' "$1")"
            version="$(ruby -e 'require "rubygems/package"; puts Gem::Package.new(ARGV[0]).spec.version' "$1")"
            gem info --remote --all --exact "$name" | grep -q "\\b${version}\\b"
          }
          for gem_file in gems/**/*.gem gems/*.gem; do
            if gem_already_published "$gem_file"; then
              echo "skip $(basename "${gem_file}") (already on RubyGems)"
              continue
            fi
            echo "Pushing ${gem_file}"
            gem push "${gem_file}"
          done

      - name: Publish to GitHub Packages (rehearsal)
        if: ${{ startsWith(github.ref, 'refs/tags/rehearsal/solvapay-ruby-v') }}
        shell: bash
        env:
          GEM_HOST_API_KEY: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p ~/.gem
          printf -- "---\n:github: Bearer ${GEM_HOST_API_KEY}\n" > ~/.gem/credentials
          chmod 0600 ~/.gem/credentials
          shopt -s nullglob
          for gem_file in gems/**/*.gem gems/*.gem; do
            echo "Pushing ${gem_file} to GitHub Packages"
            gem push --host https://rubygems.pkg.github.com/solvapay "${gem_file}"
          done

      - name: Rehearsal install smoke
        if: ${{ startsWith(github.ref, 'refs/tags/rehearsal/solvapay-ruby-v') }}
        working-directory: .
        run: |
          BASE="${GITHUB_REF_NAME#rehearsal/solvapay-ruby-v}"
          ruby sdks/ruby/scripts/install-smoke.rb \
            --host https://rubygems.pkg.github.com/solvapay \
            --name solvapay \
            --version "${BASE}.pre.${GITHUB_RUN_NUMBER}"
