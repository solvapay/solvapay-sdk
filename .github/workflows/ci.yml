name: CI

on:
  pull_request:
    branches: [main, dev]
  # Removed 'push' event to prevent duplicate runs when pushing to PR branches
  # pull_request event handles all PR validation
  # For direct pushes to main/dev, consider using branch protection rules
  # or rely on PR-only workflow (recommended: all changes via PR)
  workflow_dispatch:
    inputs:
      skip_link_validation:
        description: 'Skip link validation steps (documentation job only)'
        required: false
        type: boolean
        default: false

jobs:
  # Build and test on every supported Node line (engines.node is >=22). Each leg keeps
  # the npm its Node line bundles (22: npm 10, 24 and 26: npm 11), so create-solvapay's
  # template resolve test runs `npm install` with what users on that line actually get.
  # Lint, dependency health and the Deno gate don't depend on the Node line: they run
  # once, on 24.
  test:
    name: Build & Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24', '26']

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.6.0

      - name: Setup Deno
        if: matrix.node == '24'
        run: |
          DENO_VERSION=2.7.4
          curl -fsSL "https://github.com/denoland/deno/releases/download/v${DENO_VERSION}/deno-x86_64-unknown-linux-gnu.zip" -o /tmp/deno.zip
          unzip -o /tmp/deno.zip -d /tmp/deno
          sudo install -m 755 /tmp/deno/deno /usr/local/bin/deno
          deno --version

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check dependency health
        if: matrix.node == '24'
        run: pnpm deps:check

      - name: Run lint
        if: matrix.node == '24'
        run: pnpm lint

      - name: Build packages
        run: pnpm build:packages

      - name: Run tests
        run: pnpm test

      # Deno gate — type-checks examples/supabase-edge-mcp against the
      # workspace source of the `@solvapay/*` packages it imports (see
      # examples/supabase-edge-mcp/deno.workspace.json). Running it on
      # PRs is what lets a feature branch prove its own SDK change still
      # type-checks under Deno *before* it merges, rather than finding
      # out from a post-publish gate one commit later.
      - name: Deno gate (supabase-edge-mcp type-check against workspace source)
        if: matrix.node == '24'
        run: pnpm --filter @example/supabase-edge-mcp validate:workspace

  # Branch protection requires a check named "Lint, Build & Test". A matrix reports one
  # check per leg instead, so this job carries the required name and passes only when
  # every leg passed (a skipped or cancelled leg fails it too).
  lint-build-test:
    name: Lint, Build & Test
    runs-on: ubuntu-latest
    needs: test
    if: always()
    steps:
      - name: Require every Node leg to pass
        run: |
          echo "matrix result: ${{ needs.test.result }}"
          test "${{ needs.test.result }}" = "success"

  documentation:
    name: Documentation Validation
    runs-on: ubuntu-latest
    needs: lint-build-test
    # Runs after lint-build-test which already builds packages
    # We still need to install dependencies and build here because GitHub Actions
    # jobs run on separate runners and can't share filesystem state

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.6.0

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build:packages
        # Packages must be built for TypeDoc to resolve subpath exports (e.g., @solvapay/auth/supabase)
        # which point to dist/ files. TypeDoc uses TypeScript's module resolution which needs these files.
        # Note: This runs after lint-and-test completes, but we still need to build here because
        # GitHub Actions jobs run on separate runners and can't share build artifacts without explicit upload/download

      - name: Validate documentation links
        id: validate-links
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.skip_link_validation != 'true'
        run: pnpm exec tsx scripts/validate-doc-links.ts --skip-api
        continue-on-error: false
        # Validates non-generated documentation links (skips docs/api/** which are generated by docs repo)
        # Note: Documentation is built by the docs repo, not in this CI workflow

      - name: Check TypeDoc configuration
        id: check-typedoc
        run: pnpm docs:check
        continue-on-error: false
        # Validates TypeDoc can parse the codebase and generate JSON output
        # This catches JSDoc syntax errors and missing exports
        # Note: Actual documentation build happens in the docs repo, not here

      - name: Validate markdown files
        run: |
          # Check for common markdown issues
          echo "Checking markdown files for common issues..."

          # Check for files with no content (just headers)
          find docs -name "*.md" -type f ! -path "*/node_modules/*" ! -path "*/_media/*" ! -path "*/api/*" | while read file; do
            # Skip if file is too small (likely empty or just headers)
            if [ $(wc -l < "$file") -lt 5 ]; then
              echo "⚠️  Warning: $file seems very short (less than 5 lines)"
            fi
          done

          # Check for markdown files with no links or content
          find docs -name "*.md" -type f ! -path "*/node_modules/*" ! -path "*/_media/*" ! -path "*/api/*" -exec grep -L "." {} \; | while read file; do
            echo "⚠️  Warning: $file appears to be empty"
          done || true
        continue-on-error: true
        # Markdown validation is informational
