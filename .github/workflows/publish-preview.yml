name: Publish Preview Snapshot

# On every push to `dev`, run the pre-publish gates and cut a
# changesets snapshot to the `@preview` dist-tag. Each publish is
# addressable as `@solvapay/<pkg>@0.0.0-preview-<shortsha>` (stable
# version pin) plus a mutable `@preview` pointer at the latest.
on:
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: publish-preview
  cancel-in-progress: false

jobs:
  publish-preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.6.0

      - name: Setup Deno
        run: |
          DENO_VERSION=2.7.4
          curl -fsSL "https://github.com/denoland/deno/releases/download/v${DENO_VERSION}/deno-x86_64-unknown-linux-gnu.zip" -o /tmp/deno.zip
          unzip -o /tmp/deno.zip -d /tmp/deno
          sudo install -m 755 /tmp/deno/deno /usr/local/bin/deno
          deno --version

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check dependency health
        run: pnpm deps:check

      - name: Build packages
        run: pnpm build:packages

      - name: Run tests
        run: pnpm test

      - name: Validate fetch-runtime — Node gate
        run: pnpm validate:fetch-runtime

      # Deno gate — type-checks examples/supabase-edge-mcp against the
      # workspace source of the packages this run is about to publish,
      # via examples/supabase-edge-mcp/deno.workspace.json. This is the
      # blocking gate: it validates the exact code being shipped, and
      # unlike a gate pinned to the `@preview` dist-tag it cannot
      # deadlock (a broken publish used to freeze the tag that the gate
      # read, so the run that would have fixed it could never get past
      # its own gate). The same check runs on PRs in ci.yml, so a break
      # is normally caught before merge.
      - name: Validate fetch-runtime — Deno gate (workspace source)
        run: pnpm --filter @example/supabase-edge-mcp validate:workspace

      - name: Version snapshot
        run: pnpm changeset version --snapshot preview

      - name: Publish snapshot to @preview
        id: publish
        run: |
          set -o pipefail
          pnpm changeset publish --tag preview --no-git-tag 2>&1 | tee publish.log
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Post-publish verification — Changesets reports success based on
      # npm's exit code, but npm has been observed to exit 0 even when
      # brand-new scoped package names fail to create (granular token
      # scope, org create-restrictions, etc.). This step queries the
      # public registry for every line that Changesets claimed shipped
      # and fails the job if any package isn't fetchable after a retry
      # window.
      - name: Verify published packages landed on npm
        run: node scripts/verify-npm-publishes.mjs publish.log

      # Post-publish `@preview` gate — re-type-checks the same example
      # against the tag this run just moved, using
      # supabase/functions/mcp/deno.local.json. It is the only check
      # that exercises the assembled npm tarballs (their published
      # `exports` maps and peer ranges) rather than workspace `dist/`,
      # so it catches packaging faults the workspace gate structurally
      # cannot see. It runs *after* the registry verification above so
      # propagation is already confirmed, and after the publish so a
      # failure reports a broken published preview loudly instead of
      # withholding the publish that would fix it.
      - name: Validate fetch-runtime — Deno gate (published @preview tarballs)
        run: pnpm --filter @example/supabase-edge-mcp validate
