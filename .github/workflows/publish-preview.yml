name: Publish Preview Snapshot

# Manual `workflow_dispatch` only. Defaults to dry-run: full pre-publish
# gates, then `changeset status` + `pnpm -r publish --dry-run` (no NPM_TOKEN).
# Set `dry_run=false` to cut a real `@preview` snapshot
# (`@solvapay/<pkg>@0.0.0-preview-<shortsha>` plus a mutable `@preview`
# pointer). Inputs resolve against the dispatched ref (the workflow only
# has to exist on the default branch for dispatch to be enabled), so a
# feature branch can be dry-run before merge. `force_native` is dry-run
# only: it runs the 8-target native matrix without publishing.
#
# Non-dry-run also builds and publishes the 8 native platform packages, then
# (when `include_languages` is true) pushes the four rehearsal tags with the
# release-bot App token so language preview workflows fire.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Skip snapshot publish; run gates + pnpm -r publish --dry-run (no NPM_TOKEN)'
        required: false
        type: boolean
        default: true
      force_native:
        description: 'Dry-run only: run the 8-target native matrix even with pending changesets'
        required: false
        type: boolean
        default: false
      include_languages:
        description: 'After npm preview, push rehearsal language tags (Python, Ruby, Rust, Go)'
        required: false
        type: boolean
        default: true

concurrency:
  group: publish-preview
  cancel-in-progress: false

jobs:
  native-build:
    if: ${{ !inputs.dry_run || inputs.force_native }}
    uses: ./.github/workflows/native-build.yml

  publish-preview:
    needs: native-build
    if: ${{ !cancelled() && needs.native-build.result != 'failure' }}
    runs-on: ubuntu-latest
    env:
      SOLVAPAY_CORE_SHA: ${{ github.sha }}
    permissions:
      contents: read

    steps:
      - name: Generate release-bot token
        id: app-token
        if: ${{ !inputs.dry_run && inputs.include_languages }}
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Deno
        run: |
          DENO_VERSION=2.7.4
          curl -fsSL "https://github.com/denoland/deno/releases/download/v${DENO_VERSION}/deno-x86_64-unknown-linux-gnu.zip" -o /tmp/deno.zip
          unzip -o /tmp/deno.zip -d /tmp/deno
          sudo install -m 755 /tmp/deno/deno /usr/local/bin/deno
          deno --version

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Read release-train sentinel
        id: sentinel
        run: echo "sentinel=$(node -p "require('./internal/release-train/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check dependency health
        run: pnpm deps:check

      - name: Build packages
        run: pnpm build:packages

      - name: Run tests
        run: pnpm test

      - name: Validate fetch-runtime — Node gate
        run: pnpm validate:fetch-runtime

      # Deno gate — type-checks examples/typescript/supabase-edge-mcp against the
      # workspace source of the packages this run is about to publish, via
      # examples/typescript/supabase-edge-mcp/deno.workspace.json. This is the
      # blocking gate: it validates the exact code being shipped, and unlike a
      # gate pinned to the `@preview` dist-tag it cannot deadlock. The same
      # check runs on PRs in ci.yml, so a break is normally caught before merge.
      - name: Validate fetch-runtime — Deno gate (workspace source)
        run: pnpm --filter @example/supabase-edge-mcp validate:workspace

      - name: Version snapshot
        if: ${{ !inputs.dry_run }}
        run: pnpm changeset version --snapshot preview

      - name: Install native binding deps
        if: ${{ !inputs.dry_run || inputs.force_native }}
        working-directory: sdks/node-native
        run: npm ci

      - name: Ensure npm platform dirs
        if: ${{ !inputs.dry_run || inputs.force_native }}
        working-directory: sdks/node-native
        run: npx napi create-npm-dirs

      - name: Download native binding artifacts
        if: ${{ !inputs.dry_run || inputs.force_native }}
        uses: actions/download-artifact@v4
        with:
          path: sdks/node-native/ci-artifacts
          pattern: bindings-*
          merge-multiple: true

      - name: Place artifacts into npm/ via napi artifacts
        if: ${{ !inputs.dry_run || inputs.force_native }}
        working-directory: sdks/node-native
        run: |
          mkdir -p artifacts
          find ci-artifacts -type f -name '*.node' -exec cp -f {} artifacts/ \;
          find ci-artifacts -type f \( -name 'index.js' -o -name 'index.d.ts' \) -exec cp -f {} . \;
          ls -la artifacts/ index.js 2>/dev/null || true
          npx napi artifacts

      - name: Pre-publish artifact gate
        if: ${{ !inputs.dry_run || inputs.force_native }}
        working-directory: sdks/node-native
        run: node scripts/check-artifacts.mjs

      - name: Prepare native publish pins
        if: ${{ !inputs.dry_run || inputs.force_native }}
        run: pnpm exec tsx tools/repo/prepare-native-publish.ts

      # prepare-native-publish rewrites file: pins to semver. pnpm exec / -r
      # then refuse a frozen lockfile unless the workspace is reconciled.
      # The lockfile change is CI-local and is not committed.
      - name: Reconcile lockfile after native pins
        if: ${{ !inputs.dry_run || inputs.force_native }}
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Publish native platform packages
        if: ${{ !inputs.dry_run || inputs.force_native }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            pnpm exec tsx tools/repo/publish-native-platform-packages.ts --dry-run
          else
            pnpm exec tsx tools/repo/publish-native-platform-packages.ts
          fi

      - name: Verify native platform packages landed on npm
        if: ${{ !inputs.dry_run }}
        run: pnpm exec tsx tools/repo/verify-native-platform-publishes.ts

      - name: Assert no local-path production deps
        if: ${{ !inputs.dry_run || inputs.force_native }}
        run: pnpm exec tsx tools/repo/check-release-dryrun.ts --assert-no-local-paths

      - name: Dry-run npm publish
        if: ${{ inputs.dry_run }}
        run: |
          git fetch --no-tags origin +main:main
          pnpm changeset status
          pnpm -r publish --dry-run --no-git-checks

      - name: Tier A — print rehearsal tags (no writes)
        if: ${{ inputs.dry_run }}
        shell: bash
        env:
          SENTINEL: ${{ steps.sentinel.outputs.sentinel }}
        run: |
          set -euo pipefail
          REMOTE_TAGS="$(git ls-remote --tags origin | awk '{print $2}' | sed 's#refs/tags/##' | sed 's#^{}##')"
          pnpm exec tsx tools/repo/resolve-release-channel.ts \
            --ref refs/heads/main \
            --channel rehearsal \
            --version "${SENTINEL}" \
            --run "${GITHUB_RUN_NUMBER}" \
            --ecosystem npm \
            --assert-tags \
            --remote-tags "$(echo "${REMOTE_TAGS}" | tr '\n' ',')"
          echo "Tier A: rehearsal tags for ${SENTINEL}"

      - name: Publish snapshot to @preview
        id: publish
        if: ${{ !inputs.dry_run }}
        run: |
          set -o pipefail
          pnpm changeset publish --tag preview --no-git-tag 2>&1 | tee publish.log
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Post-publish verification — Changesets reports success based on
      # npm's exit code, but npm has been observed to exit 0 even when
      # brand-new scoped package names fail to create (granular token
      # scope, org create-restrictions, etc.). This step queries the
      # public registry for every line that Changesets claimed shipped
      # and fails the job if any package isn't fetchable after a retry
      # window.
      - name: Verify published packages landed on npm
        if: ${{ !inputs.dry_run }}
        run: node tools/repo/verify-npm-publishes.mjs publish.log

      # Post-publish `@preview` gate — re-type-checks the same example
      # against the tag this run just moved, using
      # supabase/functions/mcp/deno.local.json. It is the only check
      # that exercises the assembled npm tarballs (their published
      # `exports` maps and peer ranges) rather than workspace `dist/`,
      # so it catches packaging faults the workspace gate structurally
      # cannot see. It runs *after* the registry verification above so
      # propagation is already confirmed, and after the publish so a
      # failure reports a broken published preview loudly instead of
      # withholding the publish that would fix it.
      - name: Validate fetch-runtime — Deno gate (published @preview tarballs)
        if: ${{ !inputs.dry_run }}
        run: pnpm --filter @example/supabase-edge-mcp validate

      - name: Push rehearsal tags
        if: ${{ !inputs.dry_run && inputs.include_languages }}
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          SENTINEL: ${{ steps.sentinel.outputs.sentinel }}
        run: |
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          pnpm exec tsx tools/repo/push-rehearsal-tags.ts --version "${SENTINEL}" --replace
