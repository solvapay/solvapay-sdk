name: Publish Rust (crates.io)

# Stamps the lockstep sentinel version + core SHA, then publishes
# export → dto → core → mcp-core → transport → solvapay.
#
# Production tags (`solvapay-rust-v*`) go to crates.io.
# Rehearsal tags (`rehearsal/solvapay-rust-v*`) go to a local cargo-http-registry.
# Those globs cannot match across the `/`.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release-train version for the crates (e.g. 0.1.0)'
        required: true
        type: string
        default: '0.1.0'
      publish_to_crates_io:
        description: 'Publish to crates.io (default: dry-run only)'
        required: false
        type: boolean
        default: false
  push:
    tags:
      - 'solvapay-rust-v*'
      - 'rehearsal/solvapay-rust-v*'

permissions:
  contents: read

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install Rust toolchain
        run: rustup show

      - name: Resolve channel + version
        id: meta
        shell: bash
        env:
          GITHUB_REF: ${{ github.ref }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            pnpm exec tsx tools/repo/resolve-release-channel.ts \
              --ref "${GITHUB_REF}" \
              --run "${GITHUB_RUN_NUMBER}" \
              --version "${{ inputs.version }}" \
              --ecosystem cargo
          else
            pnpm exec tsx tools/repo/resolve-release-channel.ts \
              --ref "${GITHUB_REF}" \
              --run "${GITHUB_RUN_NUMBER}" \
              --ecosystem cargo
          fi
          echo "core_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Stamp crate versions + internal dep versions
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          SOLVAPAY_RELEASE_VERSION: ${{ steps.meta.outputs.version }}
          SOLVAPAY_CORE_SHA: ${{ steps.meta.outputs.core_sha }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, re

          version = os.environ["VERSION"]
          crates = [
              "core/solvapay-export/Cargo.toml",
              "core/solvapay-dto/Cargo.toml",
              "core/solvapay-core/Cargo.toml",
              "core/solvapay-mcp/Cargo.toml",
              "core/solvapay-transport/Cargo.toml",
              "sdks/rust/Cargo.toml",
          ]
          dep_re = re.compile(
              r'(solvapay-(?:export|dto|core|mcp-core|transport)\s*=\s*\{[^}]*?\bversion\s*=\s*")([^"]+)(")'
          )
          for rel in crates:
              path = Path(rel)
              text = path.read_text()
              text = re.sub(r'^version = ".*"$', f'version = "{version}"', text, count=1, flags=re.M)
              text = dep_re.sub(rf'\g<1>{version}\3', text)
              path.write_text(text)
          print(f"stamped version={version} core_sha={os.environ['SOLVAPAY_CORE_SHA']}")
          PY

      - name: cargo build --workspace
        env:
          SOLVAPAY_RELEASE_VERSION: ${{ steps.meta.outputs.version }}
          SOLVAPAY_CORE_SHA: ${{ steps.meta.outputs.core_sha }}
        run: cargo build --workspace --exclude solvapay-wasm

      - name: Publish graph metadata check
        run: ./tools/repo/check-publish-graph.sh

      - name: Dry-run publish (dependency order)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_to_crates_io != true && steps.meta.outputs.channel != 'rehearsal' }}
        shell: bash
        env:
          SOLVAPAY_RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        run: ./tools/repo/crates-publish.sh --dry-run --version "$SOLVAPAY_RELEASE_VERSION"

      - name: Start local cargo registry (rehearsal)
        if: ${{ steps.meta.outputs.channel == 'rehearsal' }}
        shell: bash
        run: |
          cargo install cargo-http-registry --locked
          mkdir -p /tmp/solvapay-rehearsal-registry
          cargo-http-registry /tmp/solvapay-rehearsal-registry &
          echo $! > /tmp/cargo-http-registry.pid
          mkdir -p .cargo
          cat >> .cargo/config.toml <<'EOF'
          [registries.rehearsal]
          index = "sparse+http://127.0.0.1:8000/index/"
          EOF
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/index/config.json >/dev/null; then
              echo "rehearsal registry is up"
              exit 0
            fi
            sleep 1
          done
          echo "rehearsal registry did not start" >&2
          exit 1

      - name: Publish to local registry (rehearsal)
        if: ${{ steps.meta.outputs.channel == 'rehearsal' }}
        shell: bash
        env:
          SOLVAPAY_RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        run: ./tools/repo/crates-publish.sh --registry rehearsal --version "$SOLVAPAY_RELEASE_VERSION"

      - name: Rehearsal install smoke
        if: ${{ steps.meta.outputs.channel == 'rehearsal' }}
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          WORK="$(mktemp -d)"
          cargo new --bin "$WORK/smoke"
          (
            cd "$WORK/smoke"
            mkdir -p .cargo
            cat > .cargo/config.toml <<'EOF'
          [registries.rehearsal]
          index = "sparse+http://127.0.0.1:8000/index/"
          EOF
            cargo add solvapay@${VERSION} --registry rehearsal
            cargo build
          )

      - name: Authenticate with crates.io (Trusted Publishing)
        id: crates_auth
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish_to_crates_io == true) || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/solvapay-rust-v')) }}
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish to crates.io (dependency order)
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish_to_crates_io == true) || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/solvapay-rust-v')) }}
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
          SOLVAPAY_RELEASE_VERSION: ${{ steps.meta.outputs.version }}
          SOLVAPAY_CORE_SHA: ${{ steps.meta.outputs.core_sha }}
        run: ./tools/repo/crates-publish.sh --version "$SOLVAPAY_RELEASE_VERSION"
