[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "__PYTHON_PACKAGE__"
version = "0.1.0"
description = "SolvaPay-paywalled MCP server generated by create-solvapay"
requires-python = ">=3.10"
dependencies = [
  "solvapay==0.1.0",
  "solvapay-mcp==0.1.0",
  "httpx>=0.27",
  "uvicorn>=0.32",
]

[tool.setuptools]
py-modules = ["http_serve", "tools", "main"]
