# Required GitHub check names for `main` (Step 55-b).
# One entry per expanded `.github/workflows/ci.yml` check name.
# `gate` is the redesign §10.3 / §13 compatibility gate the job enforces.
# `deferred` records a known gap with an allowed reason (the job stays required).
# `required: false` + `reason` catalogues a check that must not be branch-protected.
schemaVersion: 1
branch: main
checks:
  - name: Lint, Build & Test
    jobId: lint-build-test
    gate: OpenAPI snapshot diff; Manifest validation + coverage; TS API diff; Generated-diff checks; Per-language examples; Required-checks drift
  - name: Rust
    jobId: rust
    gate: No-unwrap / no-expect deny; wasm32 no-tokio compile check; Shared fixture conformance; Generated-diff checks; Signature-generation reliability; Doc-comment coverage; Fuzzing (stable corpus replay); Shadow mode (offline selftest)
  - name: python-binding (manylinux-x86_64)
