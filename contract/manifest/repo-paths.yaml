version: 1

dirs:
  contract: contract
  core: core
  docs: docs
  examples: examples
  tools: tools
  toolsShared: tools/shared
  toolsCodegen: tools/codegen
  toolsConformance: tools/conformance
  toolsRepo: tools/repo
  workflows: .github/workflows
  changeset: .changeset
  sdksTypescript: sdks/typescript
  internal: internal

sdks:
  node-native: sdks/node-native
  wasm: sdks/wasm
  python: sdks/python
  ruby: sdks/ruby
  go: sdks/go
  capi: sdks/capi
  rust: sdks/rust
  typescript: sdks/typescript
  pythonMcp: sdks/python-mcp
  rubyMcp: sdks/ruby-mcp
  rustMcp: sdks/rust-mcp

tsPackages:
  auth: sdks/typescript/auth
  core: sdks/typescript/core
  mcp: sdks/typescript/mcp
  mcp-core: sdks/typescript/mcp-core
  next: sdks/typescript/next
  react: sdks/typescript/react
  react-supabase: sdks/typescript/react-supabase
  server: sdks/typescript/server

toolPackages:
  cli: tools/cli
  create-solvapay: tools/create-solvapay
  init: tools/init

internalPackages:
  demo-services: internal/demo-services
  test-utils: internal/test-utils
  tsconfig: internal/tsconfig

contractInputs:
  openapiSnapshot:
    path: contract/openapi/sdk-v1.snapshot.json
    flag: --snapshot
  sdkManifest:
    path: contract/manifest/sdk-contract.yaml
    flag: --manifest
  coreSrc:
    path: core/solvapay-core/src
    flag: --core-src
  bindingResidue:
    path: contract/manifest/binding-residue.yaml
    flag: --binding-residue
  transportSrc:
    path: core/solvapay-transport/src
    flag: --transport-src
  clientFixtures:
    path: contract/fixtures/client
  fixtures:
    path: contract/fixtures

# dto-gen flag order is: flagged contractInputs (openapiSnapshot, sdkManifest,
# coreSrc, bindingResidue, transportSrc), then this list in order. Entries without `flag` are drift-only.
generated:
  - id: rustDto
    path: core/solvapay-dto/src
    flag: --out
    driftPath: core/solvapay-dto
  - id: tsOverlays
    path: sdks/typescript/server/src/types/overlays.generated.d.ts
    flag: --ts-out
  - id: tsClient
    path: sdks/typescript/server/src/types/client.generated.d.ts
    flag: --ts-client-out
  - id: tsGenerated
    path: sdks/typescript/server/src/types/generated.ts
  - id: tsParity
    path: sdks/typescript/server/src/__generated__/signature-parity.generated.test.ts
    flag: --ts-parity-out
  - id: bindingSymbols
    path: contract/manifest/binding-symbols.snapshot.json
    flag: --dump-bindings
  - id: boundaryTypes
    path: contract/manifest/boundary-types.snapshot.json
    flag: --dump-boundary-types
  - id: coreTypesTs
    path: sdks/typescript/core/src/types/boundary.generated.d.ts
    flag: --core-types-ts-out
  - id: coreDispatchTs
    path: sdks/typescript/core/src/native-dispatch.ts
    flag: --core-dispatch-ts-out
  - id: coreNativeTs
    path: sdks/typescript/core/src/native-core.ts
    flag: --core-native-ts-out
  - id: coreHelpersTs
    path: sdks/typescript/core/src/native-helpers.ts
    flag: --core-helpers-ts-out
  - id: serverDecisionsTs
    path: sdks/typescript/server/src/native-decisions.ts
    flag: --server-decisions-ts-out
  - id: nodeBindings
    path: sdks/node-native/src
    flag: --node-bindings-out
    driftPaths:
      - sdks/node-native/src/args.rs
      - sdks/node-native/src/decisions.rs
      - sdks/node-native/src/payload_builders.rs
      - sdks/node-native/src/native_client.rs
  - id: wasmBindings
    path: sdks/wasm/src
    flag: --wasm-bindings-out
    driftPaths:
      - sdks/wasm/src/args.rs
      - sdks/wasm/src/decisions.rs
      - sdks/wasm/src/payload_builders.rs
      - sdks/wasm/src/wasm_client.rs
  - id: pythonBindings
    path: sdks/python/src
    flag: --python-bindings-out
    driftPaths:
      - sdks/python/src/args.rs
      - sdks/python/src/decisions.rs
      - sdks/python/src/payload_builders.rs
      - sdks/python/src/client.rs
      - sdks/python/src/register.rs
  - id: rubyBindings
    path: sdks/ruby/ext/solvapay/src
    flag: --ruby-bindings-out
    driftPaths:
      - sdks/ruby/ext/solvapay/src/args.rs
      - sdks/ruby/ext/solvapay/src/decisions.rs
      - sdks/ruby/ext/solvapay/src/payload_builders.rs
      - sdks/ruby/ext/solvapay/src/client.rs
      - sdks/ruby/ext/solvapay/src/register.rs
  - id: nativeTs
    path: sdks/typescript/server/src/native.ts
    flag: --native-ts-out
  - id: wasmTs
    path: sdks/typescript/server/src/wasm.ts
    flag: --wasm-ts-out
  - id: nativePy
    path: sdks/python/python/solvapay/_native.py
    flag: --native-py-out
  - id: pyStub
    path: sdks/python/python/solvapay/__init__.pyi
    flag: --py-stub-out
  - id: pyParity
    path: sdks/python/tests/signature_parity_generated_test.py
    flag: --py-parity-out
  - id: pyConformance
    path: sdks/python/tests/contract
    flag: --py-conformance-out
    driftPaths:
      - sdks/python/tests/contract/__init__.py
      - sdks/python/tests/contract/clock.py
      - sdks/python/tests/contract/names.py
      - sdks/python/tests/contract/fixture_loader.py
      - sdks/python/tests/contract/compare.py
      - sdks/python/tests/contract/stub_backend.py
      - sdks/python/tests/contract/host_adapters.py
      - sdks/python/tests/contract/dispatch.py
  - id: nativeRb
    path: sdks/ruby/lib/solvapay/_native.rb
    flag: --native-rb-out
  - id: rbClient
    path: sdks/ruby/lib/solvapay/client.rb
    flag: --rb-client-out
  - id: rubyHelpers
    path: sdks/ruby/lib/solvapay/helpers.generated.rb
  - id: rbRbs
    path: sdks/ruby/sig/solvapay.rbs
    flag: --rb-rbs-out
  - id: rbParity
    path: sdks/ruby/test/signature_parity_generated_test.rb
    flag: --rb-parity-out
  - id: rbConformance
    path: sdks/ruby/test/contract
    flag: --rb-conformance-out
    driftPaths:
      - sdks/ruby/test/contract/clock.rb
      - sdks/ruby/test/contract/names.rb
      - sdks/ruby/test/contract/fixture_loader.rb
      - sdks/ruby/test/contract/compare.rb
      - sdks/ruby/test/contract/stub_backend.rb
      - sdks/ruby/test/contract/host_adapters.rb
      - sdks/ruby/test/contract/dispatch.rb
  - id: rsClient
    path: sdks/rust/src/client_generated.rs
    flag: --rs-client-out
  - id: rsBlocking
    path: sdks/rust/src/blocking_generated.rs
  - id: rsParity
    path: sdks/rust/tests/signature_parity_generated.rs
    flag: --rs-parity-out
  - id: goBindings
    path: sdks/go/wasm/src
    flag: --go-bindings-out
    driftPaths:
      - sdks/go/wasm/src/args.rs
      - sdks/go/wasm/src/decisions.rs
      - sdks/go/wasm/src/payload_builders.rs
      - sdks/go/wasm/src/client.rs
      - sdks/go/wasm/src/webhook.rs
  - id: goClient
    path: sdks/go/client_generated.go
    flag: --go-client-out
  - id: goParity
    path: sdks/go/signature_parity_generated_test.go
    flag: --go-parity-out
  - id: goConformance
    path: sdks/go/internal/contract
    flag: --go-conformance-out
    driftPaths:
      - sdks/go/internal/contract/clock.go
      - sdks/go/internal/contract/names.go
      - sdks/go/internal/contract/fixture_loader.go
      - sdks/go/internal/contract/compare.go
      - sdks/go/internal/contract/stub_backend.go
      - sdks/go/internal/contract/host_adapters.go
      - sdks/go/internal/contract/dispatch.go
  - id: cBindings
    path: sdks/capi/src
    flag: --c-bindings-out
    driftPaths:
      - sdks/capi/src/dispatch.rs
  - id: cConformance
    path: sdks/capi/ctest/contract
    flag: --c-conformance-out
    driftPaths:
      - sdks/capi/ctest/contract/dispatch.c
      - sdks/capi/ctest/contract/dispatch.h
      - sdks/capi/ctest/contract/harness.c
      - sdks/capi/ctest/contract/harness.h
  - id: cParity
    path: sdks/capi/ctest/signature_parity_generated.c
    flag: --c-parity-out
  - id: fixtureRunner
    path: tools/conformance/fixture-runner/src/registry.rs
    flag: --fixture-runner-out

# GENERATED_PATHS order (not the same as dto-gen flag order).
drift:
  - rustDto
  - tsOverlays
  - tsClient
  - tsGenerated
  - tsParity
  - nativeTs
  - wasmTs
  - bindingSymbols
  - boundaryTypes
  - coreTypesTs
  - coreDispatchTs
  - coreNativeTs
  - coreHelpersTs
  - serverDecisionsTs
  - nodeBindings
  - wasmBindings
  - pythonBindings
  - nativePy
  - pyStub
  - pyParity
  - pyConformance
  - rubyBindings
  - nativeRb
  - rbClient
  - rubyHelpers
  - rbRbs
  - rbParity
  - rbConformance
  - rsClient
  - rsBlocking
  - rsParity
  - goBindings
  - goClient
  - goParity
  - goConformance
  - cBindings
  - cConformance
  - cParity
  - fixtureRunner

lookups:
  mcpFixtures: contract/mcp-fixtures
  rustLiveReport: contract/shadow/output/rust-live-report.json
  fuzzCorpus: internal/fuzz/corpus
  fuzzRoot: internal/fuzz
  requiredChecks: contract/required-checks.yaml
  delegationAllowlist: contract/delegation-allowlist.json
  openapiDir: contract/openapi
  openapiLocalStack: contract/openapi/local-stack.yaml
  openapiSnapshot: contract/openapi/sdk-v1.snapshot.json
  openapiSource: contract/openapi/sdk-v1.source.json
  shadowOutput: contract/shadow/output
  webhookFixtures: contract/fixtures/webhook-verification
  manifestSchemaTs: tools/shared/manifest-schema.ts
  syntheticOpenapi: tools/codegen/fixtures/synthetic-openapi.json
  scriptsTmp: tools/.tmp
  pythonLiveContract: sdks/python/scripts/live_contract.py
  rubyLiveContract: sdks/ruby/scripts/live_contract.rb
  pythonPaidMcpExample: examples/python/paid-mcp
  rubyPaidMcpExample: examples/ruby/paid_mcp
  rustLiveScenarios: tools/conformance/live-contract/src/scenarios.rs
  goLiveScenarios: sdks/go/internal/livecontract/scenarios.go
  generateTypesScript: sdks/typescript/server/scripts/generate-types.ts
  goLiveContract: sdks/go/cmd/live-contract
  goWasmBuild: sdks/go/scripts/build-wasm.sh
  capiCtestRun: sdks/capi/ctest/run.sh
  capiCtestContract: sdks/capi/ctest/contract.sh
  packageJson: package.json
