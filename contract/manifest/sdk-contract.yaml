# SDK contract manifest — Phase 0 Step 2
# Canonical public-API catalog for cross-language parity.
# Validated by: pnpm manifest:check
#
# Go callable-surface methods take ctx context.Context as the first parameter
# (defaults.goContextFirstParam). Emitters must not invent this parameter.

# Shadow-mode volatile-field rules (step 25). Per-operation `shadow.volatile`
# JSON Pointers (optional) are applied in addition to these globals.
shadow:
  globalVolatileKeys:
    - createdAt
    - updatedAt
    - id
    - reference
    - idempotencyKey
    - clientSecret
    - sessionId
    - email
    # Product/plan names must differ per side on live backends (unique index).
    - name
  volatileKeySuffixes:
    - Ref
  refPrefixes:
    - prd_
    - pln_
    - cus_
    - cusess_
    - pur_
    - pi_
    - ses_
    - usg_
    - cs_
    - top_
    - mcp_

# TS-only residue for the core boundary-type emitter (Phase 3a).
# Aliases / renames / union reshapes that cannot be derived from Rust.
boundaryTypesTs:
  omit:
    - BuildPromptDescriptorMetadataOptions
    - BuildToolDescriptorMetadataOptions
    - BusinessCountryOption
    - CreditsToDisplayInput
    - GateContent
    - HelperErrorResult
    - McpContentBlock
    - McpPaywallToolResult
    - McpViewMaps
    - MerchantBranding
    - PaywallBalance
    - PaywallClientPayload
    - PaywallGate
    - PaywallGateKind
    - PaywallLimits
    - PaywallPlanSummary
    - PaywallState
    - ProductReadinessPlan
    - PromptContent
    - PromptDescriptorMetadata
    - PromptMessage
    - PromptUserMessage
    - ResponseEnvelope
    - SdkError
    - SellerIdentityInput
    - TaxIdType
    - ToolAnnotations
    - ToolDescriptorMetadata
    - ToolIcon
    - WebhookError
    - WebhookErrorCode
  aliases:
    PaymentHelperError:
      of: HelperErrorResult
      omitFields: [details]
    PlansHelperError:
      of: HelperErrorResult
      omitFields: [details]
    ProductHelperError:
      of: HelperErrorResult
      omitFields: [details]
    CheckoutHelperError:
      of: HelperErrorResult
      omitFields: [details]
    LimitsHelperError:
      of: HelperErrorResult
      omitFields: [details]
    ActivatePlanValidationError:
      of: HelperErrorResult
      omitFields: [details]
    RenewalHelperError:
      of: HelperErrorResult
    RouteErrorResult:
      of: HelperErrorResult
  rename:
    PaywallGateLimits: PaywallDecisionLimits
  reshape:
    PaywallDecisionLimits: |-
      {
        withinLimits?: boolean
        remaining?: number
        plan?: string
        checkoutUrl?: string
        confirmationUrl?: string
        activationRequired?: boolean
        plans?: unknown
        balance?: unknown
        product?: unknown
        creditBalance?: number
      }
    BusinessDetails: |-
      | { isBusiness: false; customerCountry?: SupportedBusinessCountry; customerName?: string }
      | {
          isBusiness: true
          country: SupportedBusinessCountry
          businessName?: string
          taxId?: string
          taxIdType?: TaxIdType
          customerName?: string
        }
    TopupProcessOutcome: |-
      | { status: 'timeout'; message?: string }
      | { status: 'failed' }
      | { status: 'cancelled' }
      | { status: 'succeeded' }
    PaywallOutcome: |-
      <TGate = unknown> =
        | { outcome: 'allow' }
        | { outcome: 'gate'; gate: TGate }
    PaymentIntentSource: |-
      {
        processorPaymentId: string
        clientSecret: string
        publishableKey: string
        accountId?: string
      }
    ProductReadinessInput: |-
      {
        status: string
        plans?: Array<{ isActive: boolean }>
      }
    RouteErrorKind: "'solvapay' | 'error' | 'unknown'"
    RouteErrorInput: |-
      {
        kind: RouteErrorKind
        message: string | null
        status?: number | null
        operationName: string
        defaultMessage?: string | null
      }
    BusinessDetailsValidationIssue: |-
      {
        path: PropertyKey[]
        message: string
      }
    ValidateBusinessDetailsResult: |-
      | { success: true; data: BusinessDetails }
      | { success: false; error: BusinessDetailsValidationError }
  extra:
    UsageSnapshotPurchase: |-
      {
        reference?: string
        productRef?: string
        planSnapshot?: {
          isMetered?: boolean
          options?: Record<string, unknown>[]
        } | null
        usage?: {
          used?: number
          periodStart?: string
          periodEnd?: string
        } | null
      }

