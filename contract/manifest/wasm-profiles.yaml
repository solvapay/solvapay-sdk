  - formatSubtotalLabel
  - formatVatSummaryLabel
  - resolveTaxTreatmentNote
  - shouldShowTaxRow
  - toMajorUnits
  - TOPUP_BALANCE_POLL_DELAYS_MS
  - BALANCE_RECONCILE_DELAYS_MS
  - REVERSE_CHARGE_NOTE
  - TAX_NOT_COLLECTED_NOTE
  # Pure-compute decisions that fit both §7.8 byte gates. The full set is
  # 200,826 browser-wasm gzip (ceiling 163,517). A larger curated set was
  # 158,608 wasm gzip but 300,046 wasm2js gzip (cap 230,122). This slice
  # measured 122,791 wasm gzip and 224,247 wasm2js gzip.
  - assertValidProductRef
  - attachBusinessDetailsValidationError
  - classifyCancelError
  - classifyCreateError
  - classifyLookupError
  - classifyReactivateError
  - freeMeterNamePattern
  - isCachedCustomerRefValid
  - isEmailConflict
  - normalizeCancelResponse
  - normalizeReactivateResponse
  - requireProductRef
  - resolveProductRef
  - validateAttachBusinessDetailsParams
  - validateCheckoutSessionParams
  - validateCreatePaymentIntentParams
  - validateGetProductParams
  - validateListPlansParams
  - validateProcessPaymentIntentParams
  - validatePurchaseRef

excluded:
  - name: verifyWebhook
    reason: webhook verification is edge-only (secret + clock)
  - name: WasmClient
    reason: secret-key transport client; compiled out of the browser profile
  - name: solvapayCall
    reason: MCP engine dispatch; edge-only
  - name: invokePayableNext
    reason: MCP payable driver; edge-only
  - name: resolveAuthenticatedUser
    reason: needs client-full (HMAC); compiled out of the browser profile (§7.1)
  - name: buildCustomerSnapshot
