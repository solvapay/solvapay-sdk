  - wasmVersion
  - wasmBuildInfo
  # business-details
  - validateBusinessDetails
  - deriveTaxIdType
  - isTaxIdType
  - TAX_ID_TYPES
  - resolveTaxBehavior
  - getTaxIdExample
  - getTaxIdFieldLabel
  - getTaxIdHelperText
