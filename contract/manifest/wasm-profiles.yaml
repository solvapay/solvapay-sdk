  - COUNTRY_TO_TAX_ID_TYPE
  - TAX_ID_EXAMPLE_BY_COUNTRY
  - TAX_BEHAVIORS
  - TAX_EXCLUSIVE_CURRENCIES
  # credit-display
  - creditsToDisplayMinorUnits
