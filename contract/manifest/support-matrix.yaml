version: 1

# Single declared platform/ABI matrix. Gates and publish workflows must read
# this file (or the generated JSON snapshot) instead of hand-maintained lists.

notSupported:
  architectures:
    - armv7
    - i686
    - ppc64le
    - s390x
    - riscv64
  reason: No prebuilt artifacts and no supported source-build CI row.

python:
  cpython: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
  abi: abi3-py39
  freeThreaded: not-supported
  manylinux: manylinux2014
  manylinuxWheelTags:
    - manylinux2014
    - manylinux_2_17
  wheels:
    - id: manylinux-x86_64
      os: ubuntu-latest
      target: x86_64
      manylinux: manylinux2014
      filenameIncludes:
        - manylinux
        - x86_64
      filenameExcludes:
        - musl
    - id: manylinux-aarch64
      os: ubuntu-24.04-arm
      target: aarch64
      manylinux: manylinux2014
      filenameIncludes:
        - manylinux
      filenameAnyOf:
        - aarch64
        - arm64
      filenameExcludes:
        - musl
    - id: musllinux-x86_64
      os: ubuntu-latest
      target: x86_64
      manylinux: musllinux_1_1
      filenameIncludes:
        - musllinux
        - x86_64
    - id: musllinux-aarch64
      os: ubuntu-24.04-arm
      target: aarch64
      manylinux: musllinux_1_1
      filenameIncludes:
        - musllinux
      filenameAnyOf:
        - aarch64
        - arm64
    - id: macos-universal2
      os: macos-latest
      target: universal2-apple-darwin
      manylinux: ''
      filenameIncludes:
        - macosx
        - universal2
    - id: win_amd64
      os: windows-latest
      target: x64
      manylinux: ''
      filenameAnyOf:
        - win_amd64
        - win32
    - id: win_arm64
      os: windows-11-arm
      target: aarch64
      manylinux: ''
      filenameIncludes:
        - win_arm64

ruby:
  abis: ['3.1', '3.2', '3.3', '3.4']
  requiredRuby: '>= 3.0.0'
  windows: source-gem-only
  windowsReason: rb-sys/bindgen fails in LLVM AVX10.2/AMX headers on mingw.
  gems:
    - id: x86_64-linux
      os: ubuntu-latest
      filenameIncludes:
        - x86_64-linux
      filenameExcludes:
        - musl
    - id: aarch64-linux
      os: ubuntu-latest
      filenameIncludes:
        - aarch64-linux
      filenameExcludes:
        - musl
    # linux-musl gems stay off the required matrix: current rb-sys-dock
    # hosts do not register `native:*-linux-musl` rake tasks.
    - id: x86_64-darwin
      os: ubuntu-latest
      filenameIncludes:
        - x86_64-darwin
    - id: arm64-darwin
      os: ubuntu-latest
      filenameIncludes:
        - arm64-darwin

nodeNative:
  nodeMajors: ['22', '24', '26']
  targets:
    - dir: darwin-x64
      packageName: '@solvapay/server-native-darwin-x64'
      rustTriple: x86_64-apple-darwin
      kind: node
      binary: server-native.darwin-x64.node
      platform: darwin
      arch: x64
      libc: null
      ciHost: macos-15-intel
      ciContainer: null
    - dir: darwin-arm64
      packageName: '@solvapay/server-native-darwin-arm64'
      rustTriple: aarch64-apple-darwin
      kind: node
      binary: server-native.darwin-arm64.node
      platform: darwin
      arch: arm64
      libc: null
      ciHost: macos-15
      ciContainer: null
    - dir: linux-x64-gnu
      packageName: '@solvapay/server-native-linux-x64-gnu'
      rustTriple: x86_64-unknown-linux-gnu
      kind: node
      binary: server-native.linux-x64-gnu.node
      platform: linux
      arch: x64
      libc: glibc
      ciHost: ubuntu-24.04
      ciContainer: null
    - dir: linux-arm64-gnu
      packageName: '@solvapay/server-native-linux-arm64-gnu'
      rustTriple: aarch64-unknown-linux-gnu
      kind: node
      binary: server-native.linux-arm64-gnu.node
      platform: linux
      arch: arm64
      libc: glibc
      ciHost: ubuntu-24.04-arm
      ciContainer: null
    - dir: linux-x64-musl
      packageName: '@solvapay/server-native-linux-x64-musl'
      rustTriple: x86_64-unknown-linux-musl
      kind: node
      binary: server-native.linux-x64-musl.node
      platform: linux
      arch: x64
      libc: musl
      ciHost: ubuntu-24.04
      ciContainer: 'node:{nodeMajor}-alpine'
    - dir: linux-arm64-musl
      packageName: '@solvapay/server-native-linux-arm64-musl'
      rustTriple: aarch64-unknown-linux-musl
      kind: node
      binary: server-native.linux-arm64-musl.node
      platform: linux
      arch: arm64
      libc: musl
      ciHost: ubuntu-24.04-arm
      ciContainer: 'node:{nodeMajor}-alpine'
    - dir: win32-x64-msvc
      packageName: '@solvapay/server-native-win32-x64-msvc'
      rustTriple: x86_64-pc-windows-msvc
      kind: node
      binary: server-native.win32-x64-msvc.node
      platform: win32
      arch: x64
      libc: null
      ciHost: windows-latest
      ciContainer: null
    - dir: win32-arm64-msvc
      packageName: '@solvapay/server-native-win32-arm64-msvc'
      rustTriple: aarch64-pc-windows-msvc
      kind: node
      binary: server-native.win32-arm64-msvc.node
      platform: win32
      arch: arm64
      libc: null
      ciHost: windows-11-arm
      ciContainer: null
