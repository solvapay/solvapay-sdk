  tsWrapper:
    generics: <TGate>
    signature: |-
      input: {
        withinLimits: boolean
        product: string
        limits: PaywallDecisionLimits | null
        checkoutUrl?: string
        buildGate: (product: string, limits: PaywallDecisionLimits) => TGate
      }): PaywallOutcome<TGate>
    dispatchArgs: |-
      withinLimits: input.withinLimits,
      product: input.product,
      limits: input.limits,
      checkoutUrl: input.checkoutUrl ?? null
    doc: |-
      Produce allow vs gate at the decision point.

      `buildGate` is accepted for API compatibility with the former TS body; the
      Rust path ignores it and uses in-crate `build_paywall_gate`.
    serverComment: |-
      Rust owns the gate build (in-crate `build_paywall_gate`); `buildGate` is
      ignored — kept in the signature for source compatibility.
  args:
    - name: withinLimits
      type: bool
      required: true
      extract: requireBool
      local: within_limits
    - name: product
      type: string
      required: true
      extract: requireString
      local: product
    - name: checkoutUrl
      type: string?
      required: false
      extract: optionalString
      local: checkout_url
    - name: limits
      type: value
      required: false
      extract: optionalValue
      local: limits
  callArgs:
