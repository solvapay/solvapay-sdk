[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "solvapay"
# Follows @solvapay/server: a spec change ships both together. CI checks they match.
version = "2.11.0"
description = "SolvaPay for Python: paywalls, usage billing, webhooks and paid MCP tools."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "SolvaPay" }]
keywords = ["solvapay", "payments", "billing", "paywall", "mcp", "agents"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
mcp = ["mcp>=2.3,<3", "starlette>=0.40"]
agents = ["pyjwt[crypto]>=2.9,<3"]

[project.urls]
Homepage = "https://solvapay.com"
Documentation = "https://docs.solvapay.com"
Source = "https://github.com/solvapay/solvapay-sdk/tree/main/python"

[dependency-groups]
dev = [
  "datamodel-code-generator==0.95.0; python_version >= '3.11'",
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
  "mypy>=1.13",
  "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/solvapay"]

[tool.pytest.ini_options]
testpaths = ["tests", "conformance_runner"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["src/solvapay/_generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["solvapay"]
mypy_path = "src"
plugins = ["pydantic.mypy"]
