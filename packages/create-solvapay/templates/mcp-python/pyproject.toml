[project]
name = "__PROJECT_NAME__"
version = "0.1.0"
description = "A paid MCP server built with SolvaPay"
requires-python = ">=3.10"
dependencies = [
    "solvapay[mcp]==__SOLVAPAY_VERSION__",
    "uvicorn>=0.32",
    "python-dotenv>=1.0",
