# cbindgen config for the test-only C fixture-host ABI.
language = "C"
include_guard = "SOLVAPAY_FIXTURE_HOST_H"
pragma_once = true
autogen_warning = "/* @generated by cbindgen — do not edit. Regenerate: cargo build -p solvapay-c --features fixture-host */"
documentation = true
documentation_style = "c"
style = "both"
usize_is_size_t = true

header = """\
/*
 * SolvaPay test-only fixture-host ABI.
 *
 * Linked into the C conformance harness via `--features fixture-host`.
 * Callers free returned strings with solvapay_free_string.
 */
#ifndef SOLVAPAY_FIXTURE_HOST
#define SOLVAPAY_FIXTURE_HOST
#endif
"""

[export]
include = [
  "solvapay_fh_call_sync",
  "solvapay_fh_fixture_count",
  "solvapay_fh_fixture_fn",
  "solvapay_fh_fixture_args",
  "solvapay_fh_fixture_label",
  "solvapay_fh_assert",
  "solvapay_fh_stub_start",
  "solvapay_fh_stub_assert",
]
exclude = [
  "SOLVAPAY_ABI_VERSION",
  "SolvapayClient",
  "SolvapayStatus",
  "solvapay_abi_version",
  "solvapay_version",
  "solvapay_build_info",
  "solvapay_client_new",
  "solvapay_client_call",
  "solvapay_verify_webhook",
  "solvapay_client_free",
  "solvapay_free_string",
]
item_types = ["functions"]

[defines]
"feature = fixture-host" = "SOLVAPAY_FIXTURE_HOST"

[parse]
parse_deps = false
clean = false
