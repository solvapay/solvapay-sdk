[package]
name = "solvapay-c"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Optional native C ABI for SolvaPay (Step 54 scaffold)"
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]
name = "solvapay_c"

[dependencies]
solvapay-core = { path = "../../core/solvapay-core", default-features = false, features = ["server"] }
solvapay-mcp-core = { path = "../../core/solvapay-mcp" }
solvapay-dto = { path = "../../core/solvapay-dto" }
solvapay-transport = { path = "../../core/solvapay-transport" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros"] }
fixture-runner = { path = "../../tools/conformance/fixture-runner", optional = true }
repo-paths = { path = "../../tools/shared/repo-paths", optional = true }

[features]
default = []
fixture-host = ["dep:fixture-runner", "dep:repo-paths"]

[build-dependencies]
cbindgen = "0.29.0"

[dev-dependencies]
cbindgen = "0.29.0"
repo-paths = { path = "../../tools/shared/repo-paths" }
tokio = { workspace = true, features = ["rt", "macros"] }
wiremock = { workspace = true }

[lints]
workspace = true
