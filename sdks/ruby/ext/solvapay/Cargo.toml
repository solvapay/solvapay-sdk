[package]
# Workspace package name (Ruby gem / cdylib artifact stays `solvapay` via `[lib] name`).
name = "solvapay-ruby"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Magnus Ruby binding for solvapay-core (Step 43 scaffold)"
publish = false

[lib]
name = "solvapay"
crate-type = ["cdylib"]

[features]
default = []
# Debug-only panicking export for FFI unwind tests. Never enable in publish builds.
panic-probe = []

[dependencies]
magnus = { version = "0.8.2", features = ["rb-sys"] }
rb-sys = { version = "0.9.128", default-features = false }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
serde = { workspace = true }
serde_json = { workspace = true }
solvapay-core = { path = "../../../../core/solvapay-core" }
solvapay-dto = { path = "../../../../core/solvapay-dto" }
solvapay-transport = { path = "../../../../core/solvapay-transport" }
solvapay-mcp-core = { path = "../../../../core/solvapay-mcp" }

[lints]
workspace = true
