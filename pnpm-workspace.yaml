packages:
  - 'sdks/typescript/*'
  - 'sdks/*'
  - 'tools/*'
  - 'internal/*'
  - 'examples/typescript/*'
  - 'examples/python/cloudflare-workers-mcp'
  - 'examples/rust/cloudflare-worker-mcp'
  - 'examples/cloudflare-containers'

overrides:
  next: 16.2.7
  # ext-apps pulls the MCP client in as a peer. Keep it on the release that
  # shares the pinned core, so one core version resolves.
  '@modelcontextprotocol/client': 2.4.0

# pnpm 10 flipped the default to false; the repo relies on true.
linkWorkspacePackages: true

# pnpm 11 replaced onlyBuiltDependencies with this allow-list.
allowBuilds:
  '@google/genai': true
  deno: true
  esbuild: true
  protobufjs: true
  sharp: true
  workerd: true

# The pin gate requires the latest host SDK releases, so skip the age floor for them.
minimumReleaseAgeExclude:
  - '@modelcontextprotocol/ext-apps'
  - '@modelcontextprotocol/core'
  - '@modelcontextprotocol/server'
  - '@modelcontextprotocol/node'
  - '@modelcontextprotocol/client'
