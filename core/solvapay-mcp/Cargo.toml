[package]
name = "solvapay-mcp-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Shared MCP product surface: descriptors, OAuth, auth gate, JSON-RPC engine"
publish = false

[features]
default = ["server", "engine"]
server = ["solvapay-core/server"]
engine = ["server"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
solvapay-core = { path = "../solvapay-core", default-features = false }
uuid = { version = "1.18.0", features = ["v4"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
uuid = { version = "1.18.0", features = ["v4", "js"] }

[dev-dependencies]
repo-paths = { path = "../../tools/shared/repo-paths" }
tokio = { workspace = true, features = ["rt", "macros"] }
wiremock = { workspace = true }

[lints]
workspace = true
