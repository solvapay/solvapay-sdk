[project]
name = "solvapay-example-react-web-checkout"
version = "0.0.0"
description = "Python backend for the @solvapay/react web checkout proof (example, not published)"
requires-python = ">=3.10"
dependencies = [
  "solvapay[web]",
  "pyjwt>=2.9,<3",
  "uvicorn>=0.32",
  "python-dotenv>=1.0",
]

[tool.uv]
package = false

[tool.uv.sources]
solvapay = { path = "../../../python", editable = true }

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
