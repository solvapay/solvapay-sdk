[workspace]

[package]
name = "solvapay-example-guerrillamail-mcp"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.96"
description = "SolvaPay Rust payable MCP example: Guerrilla Mail disposable inbox"
publish = false

[[bin]]
name = "guerrillamail-mcp"
path = "src/main.rs"

[lib]
name = "solvapay_example_guerrillamail_mcp"
path = "src/lib.rs"

[dependencies]
solvapay = { path = "../../../sdks/rust" }
solvapay-mcp = { path = "../../../sdks/rust-mcp" }
axum = "0.8"
tokio = { version = "1.52.4", features = ["rt-multi-thread", "macros", "net", "sync"] }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150", features = ["preserve_order"] }
futures = "0.3.31"

[dev-dependencies]
wiremock = "0.6.5"

[lints.rust]
missing_docs = "deny"

[lints.clippy]
missing_docs_in_private_items = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
