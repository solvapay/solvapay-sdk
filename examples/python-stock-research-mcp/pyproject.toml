[project]
name = "solvapay-example-stock-research-mcp"
version = "0.0.0"
description = "Paid MCP stock research server built with the solvapay Python SDK (example, not published)"
requires-python = ">=3.10"
dependencies = [
  "solvapay[mcp]",
  "httpx>=0.27",
  "uvicorn>=0.32",
  "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21"]

[tool.uv]
package = false

[tool.uv.sources]
solvapay = { path = "../../python", editable = true }

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
