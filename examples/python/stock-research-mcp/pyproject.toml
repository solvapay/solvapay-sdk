[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solvapay-example-stock-research-mcp"
version = "0.0.0"
description = "Paid MCP stock-research example (not published)"
requires-python = ">=3.10"
dependencies = [
  "solvapay",
  "solvapay-mcp",
  "httpx>=0.27",
  "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.setuptools]
py-modules = ["analysis", "http_serve", "market_data", "tools", "main"]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
